name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每日 03:17 UTC nightly（避开整点），跑集成测试 job
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  algorithm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            algorithm-service/requirements.txt
            algorithm-service/requirements-dev.txt
      - name: Run pytest
        run: |
          cd algorithm-service
          pip install -r requirements-dev.txt
          python -m pytest tests/ -q

  business-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Maven tests
        run: cd business-service && mvn -B test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # vite 7 要求 Node ^20.19 || >=22.12，固定到 22 LTS 避免解析到旧 20.x
          node-version: "22"
          cache: npm
          cache-dependency-path: web-vue/package-lock.json
      - name: Test and build web-vue
        run: |
          cd web-vue
          npm ci
          npm test
          npm run build

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: shellcheck -S error scripts/*.sh
      - name: Validate docker compose config
        run: |
          docker compose --env-file .env.example -f deploy/docker-compose.yml config -q
          docker compose --env-file .env.regression.example -f deploy/docker-compose.regression.yml config -q

  # 隔离回归（任务 0.4）：薄封装调用 scripts/run-regression.sh——脚本自行拉起
  # 独立 PostgreSQL（compose project fjsp-regression，端口 15432）与独立端口的两个服务，
  # 跑 Golden 场景断言后 down -v 清理，不触碰演示库。
  regression-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # 回归库为一次性实例，口令只需本次运行内一致；不设置时脚本也会自动生成随机口令
      FJSP_REG_DB_PASSWORD: reg-ci-${{ github.run_id }}
      # 服务日志落到工作区内，便于失败时上传 artifact
      FJSP_RUNTIME_DIR: ${{ github.workspace }}/logs/fjsp-regression
      # agent-bff 安全端到端/MCP 回归（run-regression.sh 第 5 阶段）需要 tsx；
      # agnes-harness 不随仓库分发，CI 侧独立安装（见下方 Install tsx 步骤）
      FJSP_TSX: ${{ runner.temp }}/tsx-prefix/node_modules/.bin/tsx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: algorithm-service/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          # 场景脚本仅需 fetch / crypto.randomUUID（Node ≥ 18），与仓库其它 job 保持一致用 22
          node-version: "22"
      - name: Install algorithm-service dependencies
        run: pip install -r algorithm-service/requirements.txt
      - name: Install tsx for BFF security e2e
        # 与任务 1.1/1.2 本机使用的 tsx 版本对齐（agnes-harness pnpm 树锁定 4.23.13）
        run: npm install --prefix "$RUNNER_TEMP/tsx-prefix" --no-save --no-audit --no-fund tsx@4.23.13
      - name: Run isolated regression (Golden scenarios s01-s06 + BFF security e2e)
        run: ./scripts/run-regression.sh
      - name: Upload regression logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: regression-logs-${{ github.run_id }}
          path: logs/fjsp-regression/*.log
          if-no-files-found: warn

  # 全新检出的代码须能启动：push/PR 验证本地部署 + 冒烟，
  # 会重置 CI 专用库的较长 E2E 仅在定时/手动运行。
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # CI 不启动 AGH 工作台（需要额外构建 agh-integration CLI）
      FJSP_START_AGH: "0"
      # 服务日志落到工作区内，便于失败时上传 artifact（避免隐藏目录被 upload-artifact 跳过）
      FJSP_RUNTIME_DIR: ${{ github.workspace }}/logs/fjsp-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: algorithm-service/requirements.txt
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          # 与 web-build job 一致：vite 7 要求 Node ^20.19 || >=22.12
          node-version: "22"
          cache: npm
          cache-dependency-path: web-vue/package-lock.json
      - name: Generate CI-only database password
        # check-env.sh 要求 FJSP_DB_PASSWORD 非空且不得为 .env.example 示例值；
        # CI 专用一次性库，生成随机密码即可（local profile 的 JWT 密钥用开发默认值，无需注入）
        run: echo "FJSP_DB_PASSWORD=ci-$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - name: Install algorithm-service dependencies
        run: pip install -r algorithm-service/requirements.txt
      - name: Build web-vue static assets
        # start-demo.sh 第 4 步要求 $FJSP_WEB_DIR（默认 web-vue/dist）存在 index.html
        run: cd web-vue && npm ci && npm run build
      - name: Start PostgreSQL + algorithm + business services
        # 复用 start-demo.sh：docker compose 起 postgres（container_name=fjsp-postgres，
        # smoke-test.sh 的审计校验依赖 docker exec 该容器）、uvicorn 起算法服务、
        # mvn package 后以 SPRING_PROFILES_ACTIVE=local 起业务服务并等待 readiness
        run: ./scripts/start-demo.sh
      - name: Run business smoke test
        run: ./scripts/run-smoke-test.sh
      - name: Run API field-contract E2E check
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        # 会调 POST /demo/reset 清空重建演示数据，CI 专用库无所谓
        run: ./scripts/run-e2e.sh
      - name: Upload service logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ github.run_id }}
          path: logs/fjsp-runtime/*.log
          if-no-files-found: warn
