name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  algorithm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: algorithm-service/requirements.txt
      - name: Run pytest
        run: |
          cd algorithm-service
          pip install -r requirements.txt
          python -m pytest tests/ -q

  business-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Maven tests
        run: cd business-service && mvn -B test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web-vue/package-lock.json
      - name: Build web-vue
        run: |
          cd web-vue
          npm ci
          npm run build

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: shellcheck -S error scripts/*.sh
      - name: Validate docker compose config
        run: docker compose --env-file .env.example -f deploy/docker-compose.yml config -q
