name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  algorithm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: algorithm-service/requirements.txt
      - name: Run pytest
        run: |
          cd algorithm-service
          pip install -r requirements.txt
          python -m pytest tests/ -q

  business-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Run Maven tests
        run: cd business-service && mvn -B test

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck
      - name: Check shell scripts
        run: shellcheck -S error scripts/*.sh web/scripts/*.sh
