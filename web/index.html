<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柔性车间调度与仿真决策系统</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">&#9638;</span><span>柔性车间调度</span></div>
      <nav class="menu" id="navMenu">
        <div class="menu-section">工作台</div>
        <div class="menu-item" data-page="board"><span class="menu-icon">&#9635;</span>调度看板</div>
        <div class="menu-section">基础数据</div>
        <div class="menu-parent"><span class="menu-label"><span class="menu-icon">&#9881;</span>基础数据</span><span class="chev">&#9662;</span></div>
        <div class="submenu">
          <div class="menu-item" data-page="machines">设备管理</div>
          <div class="menu-item" data-page="calendar">设备日历</div>
          <div class="menu-item" data-page="templates">工艺模板</div>
          <div class="menu-item" data-page="orders">订单管理</div>
        </div>
        <div class="menu-section">计划调度</div>
        <div class="menu-parent"><span class="menu-label"><span class="menu-icon">&#9670;</span>计划调度</span><span class="chev">&#9662;</span></div>
        <div class="submenu">
          <div class="menu-item" data-page="baseline">基线排程</div>
          <div class="menu-item" data-page="tasks">调度任务</div>
          <div class="menu-item" data-page="versions">计划版本</div>
        </div>
        <div class="menu-section">运行与分析</div>
        <div class="menu-parent"><span class="menu-label"><span class="menu-icon">&#9888;</span>事件管理</span><span class="chev">&#9662;</span></div>
        <div class="submenu">
          <div class="menu-item" data-page="insert">订单插单</div>
          <div class="menu-item" data-page="breakdown">设备故障</div>
        </div>
        <div class="menu-parent"><span class="menu-label"><span class="menu-icon">&#9641;</span>结果分析</span><span class="chev">&#9662;</span></div>
        <div class="submenu">
          <div class="menu-item" data-page="resource-gantt">资源甘特</div>
          <div class="menu-item" data-page="compare">方案对比</div>
        </div>
        <div class="menu-parent"><span class="menu-label"><span class="menu-icon">&#10003;</span>审核发布</span><span class="chev">&#9662;</span></div>
        <div class="submenu"><div class="menu-item" data-page="review">待审核方案</div></div>
        <div class="menu-item" data-page="execution"><span class="menu-icon">&#9654;</span>实际执行</div>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="crumb" id="breadcrumb"><b>工作台</b><span>/</span>调度看板</div>
        <div class="top-actions">
          <span class="muted" id="apiStatus">API 连接中…</span>
          <div class="operator"><span class="avatar">计</span><span>计划员</span></div>
        </div>
      </header>
      <div class="content" id="content">
        <section class="page-panel" id="board"></section>
        <section class="page-panel" id="machines"></section>
        <section class="page-panel" id="calendar"></section>
        <section class="page-panel" id="templates"></section>
        <section class="page-panel" id="orders"></section>
        <section class="page-panel" id="baseline"></section>
        <section class="page-panel" id="tasks"></section>
        <section class="page-panel" id="versions"></section>
        <section class="page-panel" id="insert"></section>
        <section class="page-panel" id="breakdown"></section>
        <section class="page-panel" id="resource-gantt"></section>
        <section class="page-panel" id="compare"></section>
        <section class="page-panel" id="review"></section>
        <section class="page-panel" id="execution"></section>
      </div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <div class="modal-mask" id="modalMask"></div>
  <script src="js/api.js"></script>
  <script src="js/util.js"></script>
  <script src="js/app.js"></script>
  <script src="js/pages-board.js"></script>
  <script src="js/pages-gantt.js"></script>
  <script src="js/pages-compare.js"></script>
  <script src="js/pages-schedule.js"></script>
  <script src="js/pages-events.js"></script>
  <script src="js/pages-review.js"></script>
  <script src="js/pages-misc.js"></script>
  <script>App.boot();</script>
</body>
</html>
