services:
  postgres:
    image: postgres:16
    container_name: fjsp-postgres
    environment:
      POSTGRES_DB: ${FJSP_DB_NAME:?FJSP_DB_NAME is required}
      POSTGRES_USER: ${FJSP_DB_USER:?FJSP_DB_USER is required}
      POSTGRES_PASSWORD: ${FJSP_DB_PASSWORD:?FJSP_DB_PASSWORD is required}
    ports:
      - "${FJSP_DB_PORT:-5432}:5432"
    volumes:
      - fjsp-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: fjsp-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  fjsp-pgdata:
