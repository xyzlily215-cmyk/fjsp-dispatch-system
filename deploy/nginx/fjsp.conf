server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端静态资源（web-vue/dist 挂载到 root）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到 business-service，前端与 API 同源，无需 CORS 白名单
    location /api/ {
        proxy_pass http://business:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（任务进度推送）：关闭缓冲、放宽读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 反向代理到 agent-bff（数字孪生 + AI 副驾；前端非本机部署时回退同源 /agent-api）
    location /agent-api/ {
        proxy_pass http://twin:4178;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE（/agent-api/stream、/agent-api/twin/stream）：关闭缓冲、放宽读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # 健康检查直通，便于云控制台/外部探活
    location /actuator/health {
        proxy_pass http://business:8081;
    }
}
