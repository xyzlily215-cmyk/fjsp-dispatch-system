# 本地开发 profile：Hibernate 自动建表、关闭 Flyway；含仅开发用默认值，禁止用于生产。
# 用法：SPRING_PROFILES_ACTIVE=local（scripts/start-demo.sh 已默认带上）。
spring:
  jpa:
    hibernate:
      ddl-auto: update
  flyway:
    enabled: false

fjsp:
  auth:
    # dev-only：仅本地开发使用的弱密钥，生产必须改用 FJSP_JWT_SECRET
    jwt-secret: dev-only-insecure-jwt-secret-do-not-use-in-prod
  cors:
    allowed-origins:
      - http://localhost:8082
      - http://127.0.0.1:8082
  demo:
    # 本地演示依赖 /demo/reset（scripts/reset-demo.sh、run-smoke-test.sh、run-e2e.sh）；默认关闭，仅 local 显式开启
    enabled: true
