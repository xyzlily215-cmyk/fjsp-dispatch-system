server:
  port: 8081

spring:
  application:
    name: fjsp-business-service
  datasource:
    url: jdbc:postgresql://${FJSP_DB_HOST:localhost}:${FJSP_DB_PORT:5432}/${FJSP_DB_NAME:fjsp}
    username: ${FJSP_DB_USER:fjsp}
    password: ${FJSP_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  jackson:
    serialization:
      write-dates-as-timestamps: false

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId}] %logger{36} - %msg%n"

fjsp:
  algorithm:
    base-url: ${FJSP_ALGORITHM_BASE_URL:http://localhost:8101}
    timeout-seconds: 620
  simulation-start-at: "2026-09-16T08:00:00+08:00"
  freeze-window-minutes: 30
  idempotency-ttl-hours: 24
  task:
    scan-interval-ms: ${FJSP_TASK_SCAN_INTERVAL_MS:30000}
  auth:
    jwt-secret: ${FJSP_JWT_SECRET:dev-only-insecure-jwt-secret-do-not-use-in-prod}
    token-ttl-hours: 8
